    <div class="page" id="p-novedades_ot">
      <div class="vhead">
        <div class="vhead-card">
          <div class="vhead-row vhead-top">
            <div class="vhead-tit">
              <div class="pt" title="Historial de novedades y rendimiento declarado por orden de trabajo">Novedades por OT</div>
              <span class="vh-badge" id="novot-sel-label" title="Novedad seleccionada">–</span>
            </div>
            <div class="vh-acciones">
              <button class="btn" id="novot-b-edit" onclick="novOTSelAccion('edit')" disabled title="Editar la novedad seleccionada"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.1 2.2a1.3 1.3 0 0 1 1.9 0l.8.8a1.3 1.3 0 0 1 0 1.9L5.4 13.2l-3.2.9.9-3.2z"/></svg>Editar</button>
              <button class="btn" onclick="loadNovOTList()" title="Volver a consultar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13.6 7.2A5.6 5.6 0 1 1 12 3.6"/><path d="M12.6 1.4v2.6h-2.6"/></svg>Actualizar</button>
              <button class="btn" onclick="openTNPList()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.2 1.4"/></svg>Trabajo no productivo</button>
              <button class="btn" onclick="abrirCorregirNovedades()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.1 2.2a1.3 1.3 0 0 1 1.9 0l.8.8a1.3 1.3 0 0 1 0 1.9L5.4 13.2l-3.2.9.9-3.2z"/></svg>Corregir</button>
              <button class="btn" onclick="openNovEliminadasList()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 4.2h10.8M6 4.2V2.6h4v1.6M4 4.2l.6 9h6.8l.6-9"/></svg>Novedades eliminadas</button>
            </div>
          </div>
          <div class="vhead-row vhead-fil vhead-fil-wrap">
            <div class="vh-fil-cli">
              <input type="text" id="novot-ot-search" class="sel-fil" placeholder="🔍 OT..." autocomplete="off"
                oninput="filtrarNovOTOts()" onfocus="filtrarNovOTOts()"
                onblur="setTimeout(function(){var c=$('novot-ot-results');if(c)c.style.display='none';},150)">
              <input type="hidden" id="novot-ot-fil">
              <div id="novot-ot-results" class="vh-pop"></div>
            </div>
            <select id="novot-op-fil" class="sel-fil vh-fil-sel-w" onchange="loadNovOT()" disabled><option value="">Elegí primero una OT</option></select>
            <div class="vh-fil-cli">
              <input type="text" id="novot-emp-search" class="sel-fil" placeholder="🔍 Empleado..." autocomplete="off"
                oninput="filtrarNovOTEmpleados()" onfocus="filtrarNovOTEmpleados()"
                onblur="setTimeout(function(){var c=$('novot-emp-results');if(c)c.style.display='none';},150)">
              <input type="hidden" id="novot-emp-fil">
              <div id="novot-emp-results" class="vh-pop"></div>
            </div>
            <div class="vh-fil-cli">
              <input type="text" id="novot-prod-search" class="sel-fil" placeholder="🔍 Producto..." autocomplete="off"
                oninput="filtrarNovOTProductos()" onfocus="filtrarNovOTProductos()"
                onblur="setTimeout(function(){var c=$('novot-prod-results');if(c)c.style.display='none';},150)">
              <input type="hidden" id="novot-prod-fil">
              <div id="novot-prod-results" class="vh-pop"></div>
            </div>
            <div class="vh-fil-cli">
              <input type="text" id="novot-cli-fil-search" class="sel-fil" placeholder="🔍 Cliente..." autocomplete="off"
                oninput="filtrarClienteBuscador('novot-cli-fil','— Todos los clientes —','loadNovOT')" onfocus="filtrarClienteBuscador('novot-cli-fil','— Todos los clientes —','loadNovOT')"
                onblur="setTimeout(function(){var c=$('novot-cli-fil-results');if(c)c.style.display='none';},150)">
              <input type="hidden" id="novot-cli-fil">
              <div id="novot-cli-fil-results" class="vh-pop"></div>
            </div>
            <div class="vh-fil-cli">
              <input type="text" id="novot-maq-search" class="sel-fil" placeholder="🔍 Máquina..." autocomplete="off"
                oninput="filtrarNovOTMaquinas()" onfocus="filtrarNovOTMaquinas()"
                onblur="setTimeout(function(){var c=$('novot-maq-results');if(c)c.style.display='none';},150)">
              <input type="hidden" id="novot-maq-fil">
              <div id="novot-maq-results" class="vh-pop"></div>
            </div>
            <span class="vh-fil-lbl">Fecha:</span>
            <input type="date" id="novot-fdesde-fil" class="sel-fil" onchange="loadNovOT()">
            <input type="date" id="novot-fhasta-fil" class="sel-fil" onchange="loadNovOT()">
            <label class="vh-fil-chk"><input type="checkbox" id="novot-oculta-comp" checked onchange="loadNovOT()"> Ocultar OTs completadas/canceladas</label>
            <button class="vh-fil-clear" onclick="clearNovOTFiltros()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 2.8h11.6L9.3 8.2v4.4l-2.6 1.3V8.2z"/><path d="M2 14 14 2"/></svg>Limpiar filtros</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div id="novot-info" style="font-size:12px;color:var(--color-text-secondary);margin-bottom:8px"></div>
        <div id="novot-list" class="nowrap-tbl"><div class="ld">Cargando...</div></div>
      </div>
    </div>
