    <div class="page" id="p-ordenes">
      <div class="vhead" id="ot-sticky">
        <div class="vhead-card">
          <div class="vhead-row vhead-top">
            <div class="vhead-tit">
              <div class="pt">Órdenes de trabajo</div>
              <span class="vh-badge" id="ot-sel-label" title="OT seleccionada">–</span>
            </div>
            <div class="tabs vh-tabs" id="ot-tabs"><div class="tab active" data-e="">Todas</div><div class="tab" data-e="En proceso">En proceso</div><div class="tab" data-e="Pendiente">Pendientes</div><div class="tab" data-e="Completada">Completadas</div></div>
            <div class="vh-acciones" id="ot-toolbar">
              <button class="btn" id="ot-b-ops" onclick="otSelAccion('ops')" disabled title="Operaciones de la OT seleccionada"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.4v1.7M8 12.9v1.7M1.4 8h1.7M12.9 8h1.7M3.35 3.35l1.2 1.2M11.45 11.45l1.2 1.2M12.65 3.35l-1.2 1.2M4.55 11.45l-1.2 1.2"/></svg>Ops</button>
              <button class="btn" id="ot-b-edit" onclick="otSelAccion('edit')" disabled title="Editar la OT seleccionada"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.1 2.2a1.3 1.3 0 0 1 1.9 0l.8.8a1.3 1.3 0 0 1 0 1.9L5.4 13.2l-3.2.9.9-3.2z"/></svg>Editar</button>
              <button class="btn" id="ot-b-emitir" onclick="otSelAccion('emitir')" disabled title="Imprimir la OT seleccionada"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 6V2.2h6.8V6"/><path d="M4.6 12H3.1A1.1 1.1 0 0 1 2 10.9V7.3c0-.6.5-1.1 1.1-1.1h9.8c.6 0 1.1.5 1.1 1.1v3.6c0 .6-.5 1.1-1.1 1.1h-1.5"/><path d="M4.6 10h6.8v3.8H4.6z"/></svg>Emitir</button>
              <button class="btn btn-p" id="b-ot" style="display:none" onclick="openOT()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.3v9.4M3.3 8h9.4"/></svg>Nueva OT</button>
            </div>
          </div>
          <div class="vhead-row vhead-fil">
            <input type="text" id="ot-fil-codigo" class="sel-fil" placeholder="🔍 Código de pieza" oninput="filtrarOT()" autocomplete="off">
            <div class="vh-fil-cli">
              <input type="text" id="ot-fil-cliente-search" class="sel-fil" placeholder="🔍 Buscar cliente" autocomplete="off"
                oninput="filtrarClienteBuscador('ot-fil-cliente','— Todos los clientes —','filtrarOT')"
                onfocus="filtrarClienteBuscador('ot-fil-cliente','— Todos los clientes —','filtrarOT')"
                onblur="setTimeout(function(){var c=$('ot-fil-cliente-results');if(c)c.style.display='none';},150)">
              <input type="hidden" id="ot-fil-cliente">
              <div id="ot-fil-cliente-results" class="vh-pop"></div>
            </div>
            <input type="text" id="ot-fil-oc" class="sel-fil" placeholder="🔍 OC vinculada" oninput="filtrarOT()" autocomplete="off">
            <span class="vh-fil-lbl">Total a realizar:</span>
            <input type="number" id="ot-fil-total-desde" class="sel-fil vh-fil-num" placeholder="Desde" oninput="filtrarOT()">
            <input type="number" id="ot-fil-total-hasta" class="sel-fil vh-fil-num" placeholder="Hasta" oninput="filtrarOT()">
            <button class="vh-fil-clear" onclick="clearFiltrosOT()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 2.8h11.6L9.3 8.2v4.4l-2.6 1.3V8.2z"/><path d="M2 14 14 2"/></svg>Limpiar filtros</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div id="ot-list" class="nowrap-tbl"><div class="ld">Cargando...</div></div>
      </div>
    </div>
