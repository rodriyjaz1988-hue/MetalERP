    <div class="page" id="p-registro_cambios">
      <div class="vhead">
        <div class="vhead-card">
          <div class="vhead-row vhead-top">
            <div class="vhead-tit">
              <div class="pt">Registro de cambios</div>
              <span class="vh-badge" id="cam-total" title="Cambios que cumplen el filtro">–</span>
            </div>
            <div class="vh-acciones">
              <button class="btn btn-p" onclick="nuevoCambio()">+ Nuevo cambio</button>
            </div>
          </div>
          <div class="vhead-row vhead-fil">
            <input type="date" id="cam-desde" class="sel-fil" title="Desde" onchange="renderCambios()">
            <input type="date" id="cam-hasta" class="sel-fil" title="Hasta" onchange="renderCambios()">
            <select id="cam-tipo-fil" class="sel-fil" onchange="renderCambios()"><option value="">Todos los tipos</option></select>
            <select id="cam-modulo-fil" class="sel-fil" onchange="renderCambios()"><option value="">Todos los módulos</option></select>
            <input type="text" id="cam-q" class="sel-fil vh-fil-wide" placeholder="🔍 Buscar en cualquier campo" autocomplete="off" oninput="renderCambios()">
            <button class="vh-fil-clear" onclick="clearFiltrosCambios()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 2.8h11.6L9.3 8.2v4.4l-2.6 1.3V8.2z"/><path d="M2 14 14 2"/></svg>Limpiar filtros</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div id="cam-list"><div class="ld">Cargando...</div></div>
      </div>
    </div>
