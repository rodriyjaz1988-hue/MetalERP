    <div class="page" id="p-oc_clientes">
      <div class="vhead" id="occ-sticky">
        <div class="vhead-card">
          <div class="vhead-row vhead-top">
            <div class="vhead-tit">
              <div class="pt" title="Órdenes de compra recibidas — por cliente, con explosión automática en OTs">Pedidos de clientes</div>
              <span class="vh-badge" id="occ-sel-label" title="Pedido seleccionado">–</span>
            </div>
            <div class="tabs vh-tabs" id="occ-tabs"><div class="tab active" data-e="">Todos</div><div class="tab" data-e="Recibida">Recibidos</div><div class="tab" data-e="Confirmada">Confirmados</div><div class="tab" data-e="En proceso">En proceso</div><div class="tab" data-e="Completada">Completados</div><div class="tab" data-e="Cancelada">Cancelados</div></div>
            <div class="vh-acciones" id="occ-toolbar">
              <button class="btn" id="occ-b-avance" onclick="occSelAccion('avance')" disabled title="Ver avance de entrega del pedido seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13.5h12"/><rect x="3" y="8" width="2.4" height="5.5" rx=".5"/><rect x="6.8" y="5" width="2.4" height="8.5" rx=".5"/><rect x="10.6" y="2.5" width="2.4" height="11" rx=".5"/></svg>Avance</button>
              <button class="btn" id="occ-b-edit" onclick="occSelAccion('edit')" disabled title="Editar el pedido seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.1 2.2a1.3 1.3 0 0 1 1.9 0l.8.8a1.3 1.3 0 0 1 0 1.9L5.4 13.2l-3.2.9.9-3.2z"/></svg>Editar</button>
              <button class="btn btn-p" id="b-occ" style="display:none" onclick="openOCC()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.3v9.4M3.3 8h9.4"/></svg>Nueva OC</button>
            </div>
          </div>
          <div class="vhead-row vhead-fil">
            <div class="vh-fil-cli">
              <input type="text" id="oc-cli-fil-search" class="sel-fil" placeholder="🔍 Buscar cliente" autocomplete="off"
                oninput="filtrarClienteBuscador('oc-cli-fil','— Todos los clientes —','filtrarOCC')"
                onfocus="filtrarClienteBuscador('oc-cli-fil','— Todos los clientes —','filtrarOCC')"
                onblur="setTimeout(function(){var c=$('oc-cli-fil-results');if(c)c.style.display='none';},150)">
              <input type="hidden" id="oc-cli-fil">
              <div id="oc-cli-fil-results" class="vh-pop"></div>
            </div>
            <input type="text" id="occ-fil-numero" class="sel-fil" placeholder="🔍 N° de OC" oninput="filtrarOCC()" autocomplete="off">
            <input type="text" id="occ-fil-codigo" class="sel-fil" placeholder="🔍 Código de pieza" oninput="filtrarOCC()" autocomplete="off">
            <button class="vh-fil-clear" onclick="clearFiltrosOCC()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 2.8h11.6L9.3 8.2v4.4l-2.6 1.3V8.2z"/><path d="M2 14 14 2"/></svg>Limpiar filtros</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div id="occ-list" class="nowrap-tbl"><div class="ld">Cargando...</div></div>
      </div>
    </div>
