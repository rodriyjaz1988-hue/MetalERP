    <div class="page" id="p-maquinas">
      <div class="vhead">
        <div class="vhead-card">
          <div class="vhead-row vhead-top">
            <div class="vhead-tit">
              <div class="pt">Máquinas</div>
              <span class="vh-badge" id="maq-sel-label" title="Elemento seleccionado">–</span>
            </div>
            <div class="tabs vh-tabs" id="maq-tabs"><div class="tab active" data-v="listado">Listado</div><div class="tab" data-v="mantenimiento">Plan de mantenimiento</div><div class="tab" data-v="tickets">Tickets de reparación</div></div>
            <div class="vh-acciones">
              <button class="btn" id="maq-b-edit" onclick="maqSelAccion('edit')" disabled title="Editar el elemento seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.1 2.2a1.3 1.3 0 0 1 1.9 0l.8.8a1.3 1.3 0 0 1 0 1.9L5.4 13.2l-3.2.9.9-3.2z"/></svg>Editar</button>
              <span id="maq-new-listado" style="display:contents"><button class="btn btn-p" id="b-maq" style="display:none" onclick="openMaq()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.3v9.4M3.3 8h9.4"/></svg>Nueva máquina</button></span>
              <span id="maq-new-mantenimiento" style="display:none"><button class="btn" id="mant-b-hist" onclick="mantSelAccion('hist')" disabled title="Ver las veces que se hizo la tarea seleccionada"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.8"/><path d="M8 4.8V8l2.2 1.4"/></svg>Historial</button><button class="btn" id="mant-b-real" style="display:none" onclick="mantSelAccion('real')" disabled title="Registrar que la tarea seleccionada se hizo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>Registrar realización</button><button class="btn btn-p" id="b-mant" style="display:none" onclick="openMant()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.3v9.4M3.3 8h9.4"/></svg>Nueva tarea</button></span>
              <span id="maq-new-tickets" style="display:none"><button class="btn btn-p" id="b-tkt" style="display:none" onclick="openTkt()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.3v9.4M3.3 8h9.4"/></svg>Nuevo ticket</button></span>
            </div>
          </div>
          <div class="vhead-row vhead-fil" id="maq-fil-listado">
            <input type="text" id="maq-search" class="sel-fil vh-fil-wide" placeholder="🔍 Buscar código, nombre, marca o ubicación" oninput="renderMaq()" autocomplete="off">
          </div>
          <div class="vhead-row vhead-fil" id="maq-fil-mantenimiento" style="display:none">
            <input type="text" id="mant-search" class="sel-fil vh-fil-wide" placeholder="🔍 Buscar máquina, tarea o responsable" oninput="renderMant()" autocomplete="off">
          </div>
          <div class="vhead-row vhead-fil" id="maq-fil-tickets" style="display:none">
            <div class="tabs vh-tabs" id="tkt-tabs"><div class="tab active" data-e="">Todos</div><div class="tab" data-e="Abierto">Abiertos</div><div class="tab" data-e="En proceso">En proceso</div><div class="tab" data-e="Cerrado">Cerrados</div></div>
            <input type="text" id="tkt-maq-search" class="sel-fil vh-fil-wide" placeholder="🔍 Buscar máquina" oninput="renderTkt()" autocomplete="off">
          </div>
        </div>
      </div>
      <div id="mv-listado">
        <div class="card"><div id="maq-list" class="nowrap-tbl"><div class="ld">Cargando...</div></div></div>
      </div>
      <div id="mv-mantenimiento" style="display:none">
        <div class="card"><div id="mant-list" class="nowrap-tbl"><div class="ld">Cargando...</div></div></div>
      </div>
      <div id="mv-tickets" style="display:none">
        <div class="card"><div id="tkt-list" class="nowrap-tbl"><div class="ld">Cargando...</div></div></div>
      </div>
    </div>
