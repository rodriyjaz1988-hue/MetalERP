    <div class="page" id="p-lotes">
      <div id="lote-sec-lotes">
      <div class="vhead">
        <div class="vhead-card">
          <div class="vhead-row vhead-top">
            <div class="vhead-tit">
              <div class="pt" title="Trazabilidad ISO 9001 — ingreso, consumo, liberación y vinculación a órdenes de trabajo">Lotes</div>
              <span class="vh-badge" id="lote-sel-label" title="Lote seleccionado">–</span>
            </div>
            <div class="tabs vh-tabs lote-tabs"><div class="tab active" data-t="lotes">Lotes</div><div class="tab" data-t="cajones">Cajones</div></div>
            <div class="vh-acciones" id="lote-toolbar">
              <button class="btn" id="lote-b-trazar" onclick="loteSelAccion('trazar')" disabled title="Trazabilidad del lote seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="3.6" cy="3.6" r="1.7"/><circle cx="12.4" cy="12.4" r="1.7"/><path d="M5.3 3.6h4.2a2 2 0 0 1 2 2v5.1"/></svg>Trazar</button>
              <button class="btn" id="lote-b-etiq" onclick="loteSelAccion('etiquetas')" disabled title="Embalado y etiquetado del lote seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 2.2h5.4l6.2 6.2-5.4 5.4-6.2-6.2z"/><circle cx="5.3" cy="5.3" r=".9"/></svg>Embalado y etiquetado</button>
              <button class="btn" id="lote-b-gestionar" onclick="loteSelAccion('gestionar')" disabled title="Gestionar / liberar el lote seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.4v1.7M8 12.9v1.7M1.4 8h1.7M12.9 8h1.7M3.35 3.35l1.2 1.2M11.45 11.45l1.2 1.2M12.65 3.35l-1.2 1.2M4.55 11.45l-1.2 1.2"/></svg>Gestionar</button>
            </div>
          </div>
          <div class="vhead-row vhead-fil">
            <div class="vh-fil-cli vh-fil-cli-w">
              <input type="text" id="lote-mat-fil-txt" class="sel-fil" placeholder="🔍 Material (código o descripción)..." autocomplete="off"
                oninput="filtrarLoteMatFil()"
                onfocus="if($('lote-mat-fil-txt').value)filtrarLoteMatFil()"
                onblur="setTimeout(function(){$('lote-mat-fil-drop').style.display='none';},150)">
              <input type="hidden" id="lote-mat-fil" value="">
              <div id="lote-mat-fil-drop" class="vh-pop"></div>
            </div>
            <div class="vh-fil-cli">
              <input type="text" id="lote-cli-fil-search" class="sel-fil" placeholder="🔍 Cliente..." autocomplete="off"
                oninput="filtrarClienteBuscador('lote-cli-fil','— Todos los clientes —','loadLotes')" onfocus="filtrarClienteBuscador('lote-cli-fil','— Todos los clientes —','loadLotes')"
                onblur="setTimeout(function(){var c=$('lote-cli-fil-results');if(c)c.style.display='none';},150)">
              <input type="hidden" id="lote-cli-fil">
              <div id="lote-cli-fil-results" class="vh-pop"></div>
            </div>
            <select id="lote-prov-fil" class="sel-fil vh-fil-sel-w" onchange="loadLotes()"><option value="">Todos los proveedores</option></select>
            <label class="vh-fil-chk"><input type="checkbox" id="lote-reservado-fil" onchange="renderLotesTable()"> Con más del 50% reservado</label>
            <label class="vh-fil-chk"><input type="checkbox" id="lote-oculta-agot" checked onchange="renderLotesTable()"> Ocultar agotados</label>
            <button class="vh-fil-clear" onclick="clearLotesFiltros()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 2.8h11.6L9.3 8.2v4.4l-2.6 1.3V8.2z"/><path d="M2 14 14 2"/></svg>Limpiar filtros</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div id="lote-list"><div class="ld">Cargando...</div></div>
      </div>
      </div>
      <div id="lote-sec-cajones" style="display:none">
      <div class="vhead">
        <div class="vhead-card">
          <div class="vhead-row vhead-top">
            <div class="vhead-tit">
              <div class="pt" title="Cajones de producto terminado: piezas por operación, Calidad y remitos">Cajones</div>
              <span class="vh-badge" id="caj-sel-label" title="Cajón seleccionado">–</span>
            </div>
            <div class="tabs vh-tabs lote-tabs"><div class="tab" data-t="lotes">Lotes</div><div class="tab active" data-t="cajones">Cajones</div></div>
            <div class="vh-acciones" id="caj-toolbar">
              <button class="btn" id="caj-b-ver" data-sin-guia onclick="cajSelAccion('ver')" disabled title="Trazabilidad del cajón seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="3.6" cy="3.6" r="1.7"/><circle cx="12.4" cy="12.4" r="1.7"/><path d="M5.3 3.6h4.2a2 2 0 0 1 2 2v5.1"/></svg>Trazar</button>
              <button class="btn" id="caj-b-cal" data-sin-guia onclick="cajSelAccion('calidad')" disabled title="Liberar o rechazar piezas del cajón">Calidad</button>
              <button class="btn" id="caj-b-transf" data-sin-guia onclick="cajSelAccion('transferir')" disabled title="Pasar el cajón en espera a otra OT del mismo producto">Pasar a otra OT</button>
              <button class="btn btn-warn" id="caj-b-baja" data-sin-guia onclick="cajSelAccion('baja')" disabled title="Dar de baja el cajón en espera">Dar de baja</button>
            </div>
          </div>
          <div class="vhead-row vhead-fil">
            <input type="text" id="caj-buscar" class="sel-fil vh-fil-wide" placeholder="🔍 Buscar por cajón, OT, lote o producto" oninput="clearTimeout(window._cajT);window._cajT=setTimeout(loadCajones,300)" autocomplete="off">
            <input type="hidden" id="caj-lote-fil" value="">
            <span class="vh-badge" id="caj-lote-chip" style="display:none;cursor:pointer" onclick="clearCajLote()" title="Quitar filtro de lote"></span>
            <button class="vh-fil-clear" onclick="clearCajFiltros()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 2.8h11.6L9.3 8.2v4.4l-2.6 1.3V8.2z"/><path d="M2 14 14 2"/></svg>Limpiar filtros</button>
          </div>
        </div>
      </div>
      <div class="card"><div id="caj-list" class="nowrap-tbl"><div class="ld">Cargando...</div></div></div>
      </div>
    </div>
