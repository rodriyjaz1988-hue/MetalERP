    <div class="page" id="p-ctrl_prod">
      <div class="vhead">
        <div class="vhead-card">
          <div class="vhead-row vhead-top">
            <div class="vhead-tit">
              <div class="pt" title="OTs en proceso — seleccioná una para ver sus operaciones y declarar novedades">Control de producción</div>
              <span class="vh-badge" id="ctrl-sel-label" title="OT / operación seleccionada">–</span>
            </div>
            <div class="tabs vh-tabs" id="ctrl-tabs"><div class="tab active" data-e="">Todas</div><div class="tab" data-e="En proceso">En proceso</div><div class="tab" data-e="Pendiente">Pendientes</div></div>
            <div class="vh-acciones" id="ctrl-toolbar">
              <button class="btn btn-p" id="ctrl-b-nov" onclick="ctrlSelAccion('nov')" disabled title="Declarar una novedad en la operación seleccionada"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.3v9.4M3.3 8h9.4"/></svg>Novedad</button>
              <button class="btn" id="ctrl-b-tnp" onclick="openTNP()" title="Cargar trabajo no productivo (limpieza, mantenimiento, etc.)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.3 1.4"/></svg>Trabajo no productivo</button>
              <button class="btn" id="ctrl-b-refresh" onclick="refreshCtrlProd()" title="Recargar OTs y operaciones"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13.6 8A5.6 5.6 0 1 1 11.9 4"/><path d="M12.4 1.6V4.4H9.6"/></svg>Actualizar</button>
            </div>
          </div>
          <div class="vhead-row vhead-fil">
            <input type="text" id="ctrl-ot-search" class="sel-fil vh-fil-wide" placeholder="🔍 Buscar OT o producto" oninput="filtrarCtrlOts()" autocomplete="off">
            <button class="vh-fil-clear" onclick="clearFiltrosCtrl()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 2.8h11.6L9.3 8.2v4.4l-2.6 1.3V8.2z"/><path d="M2 14 14 2"/></svg>Limpiar filtros</button>
          </div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:290px 1fr;gap:12px;align-items:start">
        <div class="card" style="padding:0;overflow:hidden">
          <div style="padding:10px 14px;border-bottom:1px solid var(--color-border-tertiary);background:var(--color-background-secondary)">
            <span style="font-size:12px;font-weight:600;color:var(--color-text-secondary);white-space:nowrap">OTs activas</span>
          </div>
          <div id="ctrl-ot-list" style="max-height:580px;overflow-y:auto;padding:4px 0"></div>
        </div>
        <div class="card">
          <div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--color-border-tertiary)">
            <div id="ctrl-ot-header" style="font-size:13px;font-weight:600;color:var(--color-text-primary)">Seleccioná una OT →</div>
          </div>
          <div id="ctrl-ops"><div class="em" style="padding:20px 0">Seleccioná una OT de la lista para ver sus operaciones.</div></div>
        </div>
      </div>
    </div>
