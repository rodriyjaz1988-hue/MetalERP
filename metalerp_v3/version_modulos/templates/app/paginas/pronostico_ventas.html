    <div class="page" id="p-pronostico_ventas">
      <div class="vhead">
        <div class="vhead-card">
          <div class="vhead-row vhead-top">
            <div class="vhead-tit">
              <div class="pt" title="Proyección de ventas futuras por producto">Pronóstico de ventas</div>
              <span class="vh-badge" id="pv-sel-label" title="Pronóstico seleccionado">–</span>
            </div>
            <div class="tabs vh-tabs" id="pv-tabs"><div class="tab active" data-e="">Todos</div><div class="tab" data-e="Alta">Altas</div><div class="tab" data-e="Baja">Bajas</div></div>
            <div class="vh-acciones" id="pv-toolbar">
              <button class="btn" id="pv-b-ver" onclick="pvSelAccion('ver')" disabled title="Mostrar u ocultar la tabla del pronóstico seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.5" width="12" height="11" rx="1.2"/><path d="M2 6.3h12M2 10h12M6.2 6.3v7.2"/></svg>Ver tabla</button>
              <button class="btn" id="pv-b-estado" onclick="pvSelAccion('estado')" disabled title="Cambiar el estado del pronóstico seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13.6 8A5.6 5.6 0 1 1 11.9 4"/><path d="M12.4 1.6V4.4H9.6"/></svg><span id="pv-b-estado-txt">Dar de baja</span></button>
              <button class="btn btn-warn" id="pv-b-elim" onclick="pvSelAccion('elim')" disabled title="Eliminar el pronóstico seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.6 9.2c0 .5.4.8.9.8h5c.5 0 .9-.3.9-.8L12 4"/></svg>Eliminar</button>
              <button class="btn btn-p" id="b-pv" onclick="openPronosticoVenta()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.3v9.4M3.3 8h9.4"/></svg>Nuevo pronóstico</button>
            </div>
          </div>
          <div class="vhead-row vhead-fil">
            <input type="text" id="pv-buscar" class="sel-fil vh-fil-wide" placeholder="🔍 Buscar por código o cliente" oninput="renderPV()" autocomplete="off">
            <button class="vh-fil-clear" onclick="clearFiltrosPV()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 2.8h11.6L9.3 8.2v4.4l-2.6 1.3V8.2z"/><path d="M2 14 14 2"/></svg>Limpiar filtros</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div id="pv-lista" class="nowrap-tbl"><div class="ld">Cargando...</div></div>
      </div>
    </div>
