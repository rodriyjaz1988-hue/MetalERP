    <div class="page" id="p-requerimientos_productivos">
      <div class="vhead">
        <div class="vhead-card">
          <div class="vhead-row vhead-top">
            <div class="vhead-tit">
              <div class="pt" title="Pedidos de materiales / procesos a proveedores tercerizados y seguimiento de entregas — se generan y actualizan solos a partir de las OTT">Requerimientos productivos</div>
              <span class="vh-badge" id="req-sel-label" title="Requerimiento seleccionado">–</span>
            </div>
            <div class="vh-acciones">
              <button class="btn" id="req-b-edit" onclick="reqSelAccion('edit')" disabled title="Editar el requerimiento seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.1 2.2a1.3 1.3 0 0 1 1.9 0l.8.8a1.3 1.3 0 0 1 0 1.9L5.4 13.2l-3.2.9.9-3.2z"/></svg>Editar</button>
              <button class="btn btn-p" id="req-b-entrega" onclick="reqSelAccion('entrega')" disabled title="Registrar la entrega del requerimiento seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.4l3.2 3.2L13 4.8"/></svg>Registrar entrega</button>
              <button class="btn btn-warn" id="req-b-elim" style="display:none" onclick="reqSelAccion('elim')" disabled title="Eliminar el requerimiento seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.6 9.2c0 .5.4.8.9.8h5c.5 0 .9-.3.9-.8L12 4"/></svg>Eliminar</button>
            </div>
          </div>
          <div class="vhead-row vhead-fil">
            <div class="tabs vh-tabs" id="req-tabs">
              <div class="tab active" data-e="">Todos</div>
              <div class="tab" data-e="PROXIMO">Próximo</div>
              <div class="tab" data-e="VENCIDO">Vencido</div>
              <div class="tab" data-e="ENTREGADO">Entregado</div>
              <div class="tab" data-e="ANULADO">Anulado</div>
            </div>
            <input type="text" id="req-buscar" class="sel-fil vh-fil-wide" placeholder="🔍 Buscar por número, código, cliente..." autocomplete="off" oninput="renderReq()">
          </div>
        </div>
      </div>
      <div class="card"><div id="req-list"><div class="ld">Cargando...</div></div></div>
    </div>
