    <div class="page" id="p-ott">
      <div class="vhead">
        <div class="vhead-card">
          <div class="vhead-row vhead-top">
            <div class="vhead-tit">
              <div class="pt">Órdenes de Trabajo de Terceros</div>
              <span class="vh-badge" id="ott-sel-label" title="OTT seleccionada">–</span>
            </div>
            <div class="vh-acciones">
              <button class="btn" id="ott-b-ver" onclick="ottSelAccion('ver')" disabled title="Ver el detalle de la OTT seleccionada"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.3 8S3.7 3.6 8 3.6 14.7 8 14.7 8 12.3 12.4 8 12.4 1.3 8 1.3 8z"/><circle cx="8" cy="8" r="1.9"/></svg>Ver</button>
              <button class="btn" id="ott-b-edit" onclick="ottSelAccion('edit')" disabled title="Editar la OTT seleccionada"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.1 2.2a1.3 1.3 0 0 1 1.9 0l.8.8a1.3 1.3 0 0 1 0 1.9L5.4 13.2l-3.2.9.9-3.2z"/></svg>Editar</button>
              <button class="btn" id="ott-b-remito" onclick="ottSelAccion('remito')" disabled title="Emitir remito de la OTT seleccionada"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 1.8h6l3 3v9.4h-9z"/><path d="M9.5 1.8v3h3M5.6 8.2h4.8M5.6 10.8h4.8"/></svg>Emitir remito</button>
              <button class="btn btn-warn" id="ott-b-dev" onclick="ottSelAccion('dev')" disabled title="Devolver al proveedor las piezas rechazadas de la OTT seleccionada"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.2L2.4 6.3l3.1 3.1"/><path d="M2.4 6.3h7a3.8 3.8 0 0 1 0 7.6H6.6"/></svg>Devolver piezas</button>
              <button class="btn" id="ott-b-comp" onclick="ottSelAccion('comp')" disabled title="Completar la OTT seleccionada"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.4l3.2 3.2L13 4.6"/></svg>Completar</button>
              <button class="btn btn-p" id="b-ott-nueva" style="display:none" onclick="abrirNuevaOTT()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.3v9.4M3.3 8h9.4"/></svg>Nueva OTT manual</button>
            </div>
          </div>
          <div class="vhead-row vhead-fil">
            <input type="text" id="ott-buscar" class="sel-fil vh-fil-wide" placeholder="🔍 Buscar pieza, OT, operación o proveedor" oninput="loadOTT()" autocomplete="off">
            <select id="ott-est-fil" class="sel-fil" onchange="loadOTT()">
              <option value="">Todos los estados</option>
              <option value="Pendiente">Pendiente</option>
              <option value="Remito emitido">Remito emitido</option>
              <option value="En proceso">En proceso</option>
              <option value="Recibido">Recibido</option>
              <option value="Completado">Completado</option>
              <option value="Cancelado">Cancelado</option>
            </select>
            <button id="ott-ocultar-btn" class="btn" onclick="toggleOcultarOTTCerradas()" title="Oculta OTTs cuya OT de origen esté Completada/Cancelada, o cuya OTT ya esté Completada"></button>
          </div>
        </div>
      </div>
      <div class="card">
        <div id="ott-list" class="nowrap-tbl"><div class="ld">Cargando...</div></div>
      </div>
    </div>
