    <div class="page" id="p-proveedores">
      <div class="vhead">
        <div class="vhead-card">
          <div class="vhead-row vhead-top">
            <div class="vhead-tit">
              <div class="pt" title="Registro, calificación y vinculación con materiales">Proveedores</div>
              <span class="vh-badge" id="prov-sel-label" title="Proveedor seleccionado">–</span>
            </div>
            <div class="tabs vh-tabs" id="prov-tabs"><div class="tab active" data-e="">Todos</div><div class="tab" data-e="Activo">Activos</div><div class="tab" data-e="Inactivo">Inactivos</div></div>
            <div class="vh-acciones" id="prov-toolbar">
              <button class="btn" id="prov-b-edit" onclick="provSelAccion('edit')" disabled title="Editar el proveedor seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.1 2.2a1.3 1.3 0 0 1 1.9 0l.8.8a1.3 1.3 0 0 1 0 1.9L5.4 13.2l-3.2.9.9-3.2z"/></svg>Editar</button>
              <button class="btn" id="prov-b-mat" onclick="provSelAccion('mat')" disabled title="Vincular un material a la lista de precios del proveedor seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3.3v9.4M3.3 8h9.4"/></svg>Material</button>
              <button class="btn" id="prov-b-hist" onclick="provSelAccion('hist')" disabled title="Historial de compra del proveedor seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.3 1.4"/></svg>Historial</button>
              <button class="btn btn-p" id="b-prov" style="display:none" onclick="nuevoProv()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.3v9.4M3.3 8h9.4"/></svg>Agregar</button>
            </div>
          </div>
          <div class="vhead-row vhead-fil">
            <input type="text" id="prov-search" class="sel-fil vh-fil-wide" placeholder="🔍 Buscar por razón social, contacto o teléfono" oninput="loadProv()" autocomplete="off">
            <button class="vh-fil-clear" onclick="clearFiltrosProv()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 2.8h11.6L9.3 8.2v4.4l-2.6 1.3V8.2z"/><path d="M2 14 14 2"/></svg>Limpiar filtros</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div id="prov-list" class="nowrap-tbl"><div class="ld">Cargando...</div></div>
      </div>
    </div>
