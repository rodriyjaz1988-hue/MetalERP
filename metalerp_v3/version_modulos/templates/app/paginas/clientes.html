    <div class="page" id="p-clientes">
      <div class="vhead">
        <div class="vhead-card">
          <div class="vhead-row vhead-top">
            <div class="vhead-tit">
              <div class="pt" title="Base de clientes del taller">Clientes</div>
              <span class="vh-badge" id="cli-sel-label" title="Cliente seleccionado">–</span>
            </div>
            <div class="tabs vh-tabs" id="cli-tabs"><div class="tab active" data-c="">Todos</div><div class="tab" data-c="Premium">Premium</div><div class="tab" data-c="Institucional">Institucional</div><div class="tab" data-c="Regular">Regular</div><div class="tab" data-c="Nuevo">Nuevos</div></div>
            <div class="vh-acciones" id="cli-toolbar">
              <button class="btn" id="cli-b-edit" onclick="cliSelAccion('edit')" disabled title="Editar el cliente seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.1 2.2a1.3 1.3 0 0 1 1.9 0l.8.8a1.3 1.3 0 0 1 0 1.9L5.4 13.2l-3.2.9.9-3.2z"/></svg>Editar</button>
              <button class="btn" id="cli-b-prod" onclick="cliSelAccion('prod')" disabled title="Ver los productos del cliente seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8 13.6 5v6L8 14.2 2.4 11V5z"/><path d="M2.4 5 8 8.2 13.6 5M8 8.2v6"/></svg>Productos</button>
              <button class="btn btn-p" id="b-cli" style="display:none" onclick="nuevoCli()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.3v9.4M3.3 8h9.4"/></svg>Nuevo cliente</button>
            </div>
          </div>
          <div class="vhead-row vhead-fil">
            <input type="text" id="cli-search" class="sel-fil vh-fil-wide" placeholder="🔍 Buscar por razón social, CUIT, contacto o email" oninput="renderCli()" autocomplete="off">
            <button class="vh-fil-clear" onclick="clearFiltrosCli()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 2.8h11.6L9.3 8.2v4.4l-2.6 1.3V8.2z"/><path d="M2 14 14 2"/></svg>Limpiar filtros</button>
          </div>
        </div>
      </div>
      <div class="card"><div id="cli-list"><div class="ld">Cargando...</div></div></div>
    </div>
