    <div class="page" id="p-remitos_emitidos">
      <div class="vhead">
        <div class="vhead-card">
          <div class="vhead-row vhead-top">
            <div class="vhead-tit">
              <div class="pt">Remitos emitidos</div>
              <span class="vh-badge" id="rem-sel-label" title="Remito seleccionado">–</span>
            </div>
            <div class="vh-acciones">
              <button class="btn" id="rem-b-traz" onclick="remSelAccion('traz')" disabled title="Ver de qué OT, lotes de materia prima y cajones salió lo remitido"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="3.5" cy="3.5" r="1.8"/><circle cx="3.5" cy="12.5" r="1.8"/><circle cx="12.5" cy="8" r="1.8"/><path d="M3.5 5.3v5.4M5.2 4.2l5.6 3M5.2 11.8l5.6-3"/></svg>Trazabilidad</button>
              <button class="btn" id="rem-b-pdf" onclick="remSelAccion('pdf')" disabled title="Generar el PDF del remito seleccionado para imprimirlo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6V2h8v4"/><rect x="1.8" y="6" width="12.4" height="5.5" rx="1"/><path d="M4 9.5h8V14H4z"/></svg>Emitir Remito</button>
              <button class="btn btn-p" id="rem-b-ver" onclick="remSelAccion('ver')" disabled title="Ver el detalle del remito seleccionado"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.3 8S3.7 3.6 8 3.6 14.7 8 14.7 8 12.3 12.4 8 12.4 1.3 8 1.3 8z"/><circle cx="8" cy="8" r="1.9"/></svg>Ver</button>
            </div>
          </div>
          <div class="vhead-row vhead-fil">
            <div class="vh-fil-cli">
              <input type="text" id="rem-fil-cli-search" class="sel-fil" placeholder="🔍 Buscar cliente" autocomplete="off"
                oninput="filtrarClienteBuscador('rem-fil-cli','Todos','applyRemFiltros')" onfocus="filtrarClienteBuscador('rem-fil-cli','Todos','applyRemFiltros')"
                onblur="setTimeout(function(){var c=$('rem-fil-cli-results');if(c)c.style.display='none';},150)">
              <input type="hidden" id="rem-fil-cli">
              <div id="rem-fil-cli-results" class="vh-pop"></div>
            </div>
            <div class="vh-fil-cli">
              <input type="text" id="rem-fil-mat" class="sel-fil" placeholder="🔍 Código de pieza / material" autocomplete="off" oninput="onRemFilMatInput()"
                onblur="setTimeout(function(){$('rem-fil-mat-sug').style.display='none';},150)">
              <div id="rem-fil-mat-sug" class="vh-pop"></div>
            </div>
            <div class="vh-fil-cli">
              <input type="text" id="rem-fil-oc" class="sel-fil" placeholder="🔍 OC del cliente" autocomplete="off" oninput="onRemFilOcInput()"
                onblur="setTimeout(function(){$('rem-fil-oc-sug').style.display='none';},150)">
              <div id="rem-fil-oc-sug" class="vh-pop"></div>
            </div>
            <span class="vh-fil-lbl">Fecha:</span>
            <input type="date" id="rem-fil-fecha" class="sel-fil" style="flex:0 1 150px" onchange="applyRemFiltros()">
            <button class="vh-fil-clear" onclick="clearRemFiltros()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 2.8h11.6L9.3 8.2v4.4l-2.6 1.3V8.2z"/><path d="M2 14 14 2"/></svg>Limpiar filtros</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div id="rem-hist"></div>
        <div id="rem-pager" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px solid var(--color-border-tertiary)">
          <span id="rem-rango" style="font-size:12px;color:var(--color-text-secondary)"></span>
          <div style="display:flex;align-items:center;gap:6px">
            <select id="rem-pp" class="sel-fil" onchange="loadRemitidos(1)" style="padding:4px 8px;font-size:12px">
              <option value="25" selected>25 por página</option>
              <option value="50">50 por página</option>
              <option value="100">100 por página</option>
              <option value="200">200 por página</option>
            </select>
            <button class="btn btn-s" id="rem-prev" onclick="remPagina(-1)">‹ Anterior</button>
            <span id="rem-pag-lbl" style="font-size:12px;color:var(--color-text-secondary);min-width:90px;text-align:center"></span>
            <button class="btn btn-s" id="rem-next" onclick="remPagina(1)">Siguiente ›</button>
          </div>
        </div>
      </div>
    </div>
